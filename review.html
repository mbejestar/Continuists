<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internal evaluation · Continuum</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">Continuum</a><nav class="navlinks"><a href="dashboard.html">Dashboard</a><a href="marketplace.html">Marketplace</a><a href="index.html" data-action="logout">Log out</a>
</nav><div class="nav-actions"><span class="muted small">Internal prototype review</span></div></div></header><main class="page-main"><section class="section"><div class="container" style="max-width:1000px"><div class="card"><span class="eyebrow">Evaluation</span><h2>Marketplace review queue</h2><p class="muted">This page simulates the internal evaluation step. A production version must protect this area with staff roles, authentication, audit logs and approval controls.</p><div id="review-root"></div></div></div></section></main><script src="app.js" defer></script><script>document.addEventListener('DOMContentLoaded',()=>{const r=document.querySelector('#review-root');const S=JSON.parse(localStorage.getItem('continuum_premium_v1')||'{"missions":[]}');const ms=S.missions.filter(m=>m.transfer&&m.transfer.evaluation==='pending');r.innerHTML=ms.length?ms.map(m=>`<div class="list-row"><div><b>${m.title}</b><div class="muted small">Proposed R ${Number(m.transfer.price).toLocaleString('en-ZA')} · ${m.problem}</div></div><button class="btn primary" data-approve="${m.id}">Approve listing</button></div>`).join(''):'<p class="muted">No missions are waiting for evaluation.</p>';document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{const s=JSON.parse(localStorage.getItem('continuum_premium_v1'));const m=s.missions.find(x=>x.id===b.dataset.approve);if(m){m.transfer.evaluation='approved';m.transfer.listed=true;m.status='listed';localStorage.setItem('continuum_premium_v1',JSON.stringify(s));location.reload()}})});</script><footer class="site-footer"><a href="terms.html">Terms &amp; Conditions</a></footer>
</body></html>
